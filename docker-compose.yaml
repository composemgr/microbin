# nginx proxy address - http://172.17.0.1:59054

name: microbin
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: danielszabo99/microbin:latest
    container_name: microbin-app
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      - TZ=${TZ:-America/New_York}
      - CONTAINER_NAME=microbin-app
      - HOSTNAME=${BASE_HOST_NAME:-$HOSTNAME}
      - MICROBIN_ADMIN_USERNAME=${APP_ADMIN_USER:-administrator}
      - MICROBIN_ADMIN_PASSWORD=${APP_ADMIN_PASS:-changeme_admin_password}
      - MICROBIN_EDITABLE=false
      - MICROBIN_GC_DAYS=365
      - MICROBIN_FOOTER_TEXT=${APP_ORG_NAME:-MicroBin Service}
      - MICROBIN_HIDE_FOOTER=false
      - MICROBIN_HIDE_HEADER=false
      - MICROBIN_HIDE_LOGO=true
      - MICROBIN_NO_LISTING=false
      - MICROBIN_HIGHLIGHTSYNTAX=true
      - MICROBIN_PRIVATE=true
      - MICROBIN_SHORT_PATH=https://${BASE_HOST_NAME:-$HOSTNAME}
      - MICROBIN_PUBLIC_PATH=https://${BASE_HOST_NAME:-$HOSTNAME}
      - MICROBIN_CUSTOM_CSS=https://cdn.jsdelivr.net/npm/water.css@2/out/dark.min.css
      - MICROBIN_READONLY=false
      - MICROBIN_SHOW_READ_STATS=true
      - MICROBIN_TITLE=${APP_ORG_NAME:-MicroBin}
      - MICROBIN_ENABLE_BURN_AFTER=true
      - MICROBIN_DEFAULT_BURN_AFTER=0
      - MICROBIN_WIDE=false
      - MICROBIN_QR=true
      - MICROBIN_ETERNAL_PASTA=true
      - MICROBIN_ENABLE_READONLY=true
      - MICROBIN_DEFAULT_EXPIRY=1week
      - MICROBIN_NO_FILE_UPLOAD=false
      - MICROBIN_HASH_IDS=true
      - MICROBIN_ENCRYPTION_CLIENT_SIDE=true
      - MICROBIN_ENCRYPTION_SERVER_SIDE=true
      - MICROBIN_MAX_FILE_SIZE_ENCRYPTED_MB=50
      - MICROBIN_MAX_FILE_SIZE_UNENCRYPTED_MB=50
      - MICROBIN_DISABLE_UPDATE_CHECKING=true
      - MICROBIN_LIST_SERVER=true
      - MICROBIN_DISABLE_TELEMETRY=false
    ports:
      - '172.17.0.1:59054:8080'
    volumes:
      - './volumes/data/microbin:/app/microbin_data'
    networks:
      - microbin
      - proxy
      - cloudflare
    labels:
      - 'traefik.enable=true'
      - 'cloudflare.enable=true'
      - 'traefik.docker.network=proxy'
      - 'cloudflare.service=http://microbin-app:8080'
      - 'cloudflare.hostname=microbin.${CLOUDFLARE_ZONE_NAME:-}'
      - 'traefik.http.routers.microbin-app.entrypoints=http'
      - 'traefik.http.routers.microbin-app-secure.tls=true'
      - 'traefik.http.routers.microbin-app.rule=Host($(${BASE_HOST_NAME:-$HOSTNAME}))'
      - 'traefik.http.middlewares.microbin-app-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.microbin-app.middlewares=microbin-app-https-redirect'
      - 'traefik.http.routers.microbin-app-secure.entrypoints=https'
      - 'traefik.http.routers.microbin-app-secure.rule=Host($(${BASE_HOST_NAME:-$HOSTNAME}))'
      - 'traefik.http.routers.microbin-app-secure.tls.certresolver=cloudflare'
      - 'traefik.http.routers.microbin-app-secure.service=microbin-app'
      - 'traefik.http.services.microbin-app.loadbalancer.server.port=8080'

networks:
  microbin:
    name: microbin
    external: false
  proxy:
    external: true
  cloudflare:
    external: true
